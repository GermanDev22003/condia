<ion-content [fullscreen]="true">
  <header class="cabecera">
    <button class="volver" type="button" (click)="volver()">‹ Inicio</button>
    <h1>Cambiar contraseña</h1>
  </header>

  <section class="contenido">
    @if (exito()) {
      <p class="exito">Tu contraseña fue actualizada. Las demás sesiones abiertas se cerraron.</p>
      <button class="nuevo" type="button" (click)="volver()">Volver al inicio</button>
    } @else {
      <form (submit)="$event.preventDefault(); guardar()">
        <label>
          Contraseña actual
          <input [type]="ver() ? 'text' : 'password'" autocomplete="current-password" [value]="actual()" (input)="actual.set($any($event.target).value)" />
        </label>
        <label>
          Nueva contraseña (mínimo 8)
          <input [type]="ver() ? 'text' : 'password'" autocomplete="new-password" [value]="nueva()" (input)="nueva.set($any($event.target).value)" />
        </label>
        <label>
          Confirmar nueva contraseña
          <input [type]="ver() ? 'text' : 'password'" autocomplete="new-password" [value]="confirmacion()" (input)="confirmacion.set($any($event.target).value)" />
        </label>
        <label class="casilla">
          <input type="checkbox" [checked]="ver()" (change)="ver.set($any($event.target).checked)" />
          Mostrar contraseñas
        </label>
        @if (error()) {
          <p class="error">{{ error() }}</p>
        }
        <div class="botones">
          <button type="button" (click)="volver()">Cancelar</button>
          <button type="submit" class="principal" [disabled]="enviando()">
            {{ enviando() ? 'Guardando…' : 'Guardar contraseña' }}
          </button>
        </div>
      </form>
    }
  </section>
</ion-content>
