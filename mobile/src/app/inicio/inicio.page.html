<ion-content [fullscreen]="true" class="inicio">
  <header class="cabecera">
    <div class="fila">
      <span class="lugar">{{ lugar() }}</span>
      <button class="salir" type="button" (click)="salir()">Salir</button>
    </div>
    <h1>Hola, {{ nombre() }} 👋</h1>
  </header>

  <section class="contenido">
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <article class="tarjeta tocable" (click)="verCuotas()">
      <p class="etiqueta">TOTAL PENDIENTE</p>
      @if (pendiente() !== null) {
        <p class="monto">${{ pendiente() }}</p>
        <span>Toca para ver mis cuotas</span>
      } @else {
        <p class="aviso">Cargando…</p>
      }
    </article>

    <article class="tarjeta fila">
      <div>
        <strong>Mis quejas</strong>
        <span>Próximamente</span>
      </div>
    </article>

    <article class="tarjeta fila">
      <div>
        <strong>Mantenimiento</strong>
        <span>Próximamente</span>
      </div>
    </article>

    <article class="tarjeta fila tocable" (click)="verCuotas()">
      <div>
        <strong>Mis cuotas y pagos</strong>
        <span>Cuotas, saldo y historial de pagos</span>
      </div>
    </article>
  </section>
</ion-content>
